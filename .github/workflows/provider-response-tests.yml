name: Provider response regression tests

on:
  push:
    branches:
      - diagnostics/groq-response-handling
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library regression tests
        run: python -m unittest discover -s tests -v
