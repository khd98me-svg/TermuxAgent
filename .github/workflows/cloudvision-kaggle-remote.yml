name: CloudVision remote Kaggle GPU job

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Recorded YouTube video URL
        required: true
        type: string
      scale:
        description: Output scale (1 preserves source dimensions)
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
      max_frames:
        description: Diagnostic frame limit (24 for smoke test; blank for full video)
        required: false
        default: "24"
        type: string

permissions:
  contents: write

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CloudVision branch
        uses: actions/checkout@v4
        with:
          ref: cloudvision-kaggle-bridge
          fetch-depth: 0

      - name: Validate required Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_ID: ${{ secrets.KAGGLE_KERNEL_ID }}
        run: |
          test -n "$KAGGLE_USERNAME" || (echo "Missing repository secret KAGGLE_USERNAME" && exit 1)
          test -n "$KAGGLE_API_TOKEN" || (echo "Missing repository secret KAGGLE_KEY (Kaggle API token)" && exit 1)
          test -n "$KAGGLE_KERNEL_ID" || (echo "Missing repository secret KAGGLE_KERNEL_ID" && exit 1)

      - name: Create unique GitHub job command
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SCALE: ${{ inputs.scale }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          command = {
              "id": "remote-" + os.environ["RUN_ID"],
              "action": "video_upscale",
              "source_url": os.environ["SOURCE_URL"].strip(),
              "scale": int(os.environ["SCALE"]),
              "tile": 256,
              "crf": 18,
          }
          limit = os.environ.get("MAX_FRAMES", "").strip()
          if limit:
              command["max_frames"] = int(limit)
          with open("cloudvision/bridge-command.json", "w", encoding="utf-8") as f:
              json.dump(command, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("Created CloudVision command:", command["id"])
          PY
          echo "Embedded command prepared for Kaggle; no GitHub token is needed inside the notebook."

      - name: Install Kaggle CLI and prepare notebook package
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_ID: ${{ secrets.KAGGLE_KERNEL_ID }}
        run: |
          python -m pip install --quiet --upgrade kaggle
          mkdir -p cloudvision/remote-kernel
          cp cloudvision/kaggle_github_bridge.ipynb cloudvision/remote-kernel/
          python - <<'PY'
          import json, os
          from pathlib import Path
          command = json.loads(Path("cloudvision/bridge-command.json").read_text(encoding="utf-8"))
          notebook_path = Path("cloudvision/remote-kernel/kaggle_github_bridge.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          code = notebook["cells"][1]
          command_literal = json.dumps(json.dumps(command, ensure_ascii=False))
          code["source"] = [
              "import os, sys, subprocess, requests\n",
              f"os.environ['CLOUDVISION_COMMAND_JSON'] = {command_literal}\n",
              "worker_url = 'https://raw.githubusercontent.com/khd98me-svg/TermuxAgent/cloudvision-kaggle-bridge/cloudvision/kaggle_bridge.py'\n",
              "response = requests.get(worker_url, timeout=60)\n",
              "response.raise_for_status()\n",
              "script_path = '/kaggle/working/kaggle_bridge.py'\n",
              "with open(script_path, 'w', encoding='utf-8') as f: f.write(response.text)\n",
              "print('CloudVision worker downloaded. Starting embedded one-shot job...')\n",
              "subprocess.run([sys.executable, script_path], check=True)\n",
          ]
          notebook_path.write_text(json.dumps(notebook, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          metadata = {
              "id": os.environ["KAGGLE_KERNEL_ID"],
              "title": os.environ["KAGGLE_KERNEL_ID"].split("/", 1)[1],
              "code_file": "kaggle_github_bridge.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
          }
          with open("cloudvision/remote-kernel/kernel-metadata.json", "w") as f:
              json.dump(metadata, f, indent=2)
          PY

      - name: Launch the existing Kaggle GPU notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push -p cloudvision/remote-kernel

      - name: Wait for Kaggle execution
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_ID: ${{ secrets.KAGGLE_KERNEL_ID }}
        run: |
          for attempt in $(seq 1 90); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -qiE 'COMPLETE|KernelWorkerStatus.COMPLETE'; then
              exit 0
            fi
            if echo "$status" | grep -qiE 'ERROR|CANCELLED|FAILED'; then
              echo "Kaggle kernel failed."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for Kaggle kernel."
          exit 1

      - name: Download Kaggle outputs
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_ID: ${{ secrets.KAGGLE_KERNEL_ID }}
        run: |
          mkdir -p cloudvision-output
          kaggle kernels output "$KAGGLE_KERNEL_ID" -p cloudvision-output
          find cloudvision-output -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Upload processed video and reports
        uses: actions/upload-artifact@v4
        with:
          name: cloudvision-${{ github.run_id }}
          path: cloudvision-output/**
          if-no-files-found: error
          retention-days: 7
